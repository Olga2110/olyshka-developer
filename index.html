<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="style.css">
		<title>ToDo App</title>
</head>
<body>
<div class="add-task">
		<input class="input-for-add-task" type="text">
		<button class="button_add_task">Добавить</button>
</div>
<div class="tasks-filter">
		<button class="all-tasks-btn">Все</button>
		<button class="completed-tasks-btn">Выполненные</button>
		<button class="not-completed-tasks-btn">Невыполненные</button>
</div>
<div class="all-tasks">
		<div id="loading">Загрузка...</div>
</div>
<div class ="error">Ошибка загрузки</div>

<script src="index.js"></script>
</body>

</html>
